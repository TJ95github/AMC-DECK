<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F5F6F3">
<meta name="color-scheme" content="light">
<title>AMC OSCE station deck</title>
<style>
  :root{
    --paper:#F5F6F3; --card:#FFFFFF; --ink:#1B1F22; --ink-2:#4A5158; --ink-3:#8A9198; --line:#DDE1DC;
    --pe:#1F7A8C; --med:#3B4E9E; --og:#8C2F5B; --paeds:#C7791A; --psych:#3D7A4B; --couns:#5B6673;
    --ok:#2E7D5B; --warn:#B5541B; --bad:#A63A3A;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation;min-height:44px}
  button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #6C9BD1;outline-offset:2px}
  .app{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  .cols{display:block}
  /* iPad landscape / desktop Chrome: stem on the left, timer or ratings pinned on the right */
  @media (min-width:900px){
    .app{max-width:1100px}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
    .side{position:sticky;top:14px}
    .side .timer{flex-direction:column;margin:0}
    .side .ring{width:180px;height:180px} .side .ring svg{width:180px;height:180px} .side .ring .t{font-size:40px}
    .side .tbtns{width:100%}
    .side .rate{grid-template-columns:1fr 1fr}
    .stem{font-size:18.5px}
  }
  @media (min-width:768px) and (max-width:899px){ .app{max-width:720px} .stem{font-size:18px} }
  @media (hover:hover){ .btn:hover{filter:brightness(.95)} .chip:hover{border-color:var(--ink-3)} }
  @media (pointer:coarse){ .rate button{padding:14px 4px} .btn{padding:13px 14px} }

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .top h1{font:600 17px/1.2 inherit;margin:0;letter-spacing:.01em}
  .top .sub{font-size:12.5px;color:var(--ink-3)}
  .iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}

  /* daily target band — first thing on the page */
  .goal{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 12px}
  .goal.done{border-color:var(--ok);background:#F2F8F5}
  .goal .g1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .goal .lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .goal .num{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .goal .num .of{font-size:16px;font-weight:600;color:var(--ink-3)}
  .goal.done .num{color:var(--ok)}
  .goal .gbar{height:9px;border-radius:999px;background:var(--line);margin:9px 0 7px;overflow:hidden}
  .goal .gbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .25s}
  .goal .g2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3)}
  .goal .g2 .left{color:var(--ink-2)} .goal .g2 .left b{font-size:15px;color:var(--ink)}

  /* backlog rail — what did not get done, stacking up on the right edge */
  .bk{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;background:var(--card);
      border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;box-shadow:0 2px 14px rgba(0,0,0,.09);
      padding:10px 8px;width:58px;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;transition:width .18s}
  .bk[hidden]{display:none}
  .bk .bkn{font-size:22px;font-weight:700;color:var(--ink);line-height:1}
  .bk .bkn.bad{color:var(--bad)} .bk .bkn.ok{color:var(--ok)}
  .bk .bkc{font-size:10px;font-weight:700;color:var(--bad);margin-top:4px;line-height:1.2}
  .bk .bkl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-top:3px}
  .bk .ticks{display:flex;gap:2px;justify-content:center;align-items:flex-end;margin-top:8px}
  .bk .ticks i{width:4px;background:var(--line);border-radius:2px;display:block;position:relative}
  .bk .ticks i span{position:absolute;bottom:0;left:0;right:0;background:var(--ok);border-radius:2px;display:block}
  .bk.open{width:268px;max-width:86vw;text-align:left;padding:14px;cursor:default}
  .bk .panel{display:none} .bk.open .panel{display:block} .bk.open .mini{display:none}
  .bk h4{margin:0 0 3px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .bk .tot{font-size:30px;font-weight:700;color:var(--bad);line-height:1.05}
  .bk .tot.ok{color:var(--ok)}
  .bk .tot small{font-size:13px;font-weight:600;color:var(--ink-3)}
  .bk .paid{font-size:12.5px;color:var(--ok);font-weight:600;margin-top:3px}
  .bk .hint{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.35}
  .bk table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:9px}
  .bk td{padding:3px 0;border-top:1px solid var(--line);color:var(--ink-2)}
  .bk td.d{color:var(--ink-3)} .bk td.s{text-align:right;font-weight:700;color:var(--bad)}
  .bk td.s.z{color:var(--ok)}
  .bk .bkbtn{display:flex;gap:8px;margin-top:10px}
  .bk .bkbtn button{flex:1;min-height:36px;font-size:12.5px;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:6px}
  @media (max-width:899px){ .bk{width:46px;padding:8px 6px} .bk .bkn{font-size:18px} }
  body.hasbk .app{padding-right:calc(70px + env(safe-area-inset-right))}
  @media (max-width:899px){ body.hasbk .app{padding-right:calc(56px + env(safe-area-inset-right))} }

  /* filters */
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink-3))}
  .chip.on{border-color:var(--c,var(--ink));color:var(--ink);background:#fff}
  .chip .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}
  .modes{display:flex;gap:6px;margin-bottom:12px}
  .modes button{flex:1;padding:8px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;color:var(--ink-2)}
  .modes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* the station card */
  .station{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 18px 22px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .station::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c,var(--ink-3))}
  .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .cat{font-size:13px;font-weight:600;color:var(--c,var(--ink))}
  .idn{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .stem{font-family:Georgia,"Times New Roman",serif;font-size:17.5px;line-height:1.5;margin:0 0 14px;color:var(--ink)}
  .stem p{margin:0 0 10px}
  .setting{font-family:Georgia,serif;font-size:14.5px;color:var(--ink-2);margin-bottom:8px}
  .tasks{margin:0 0 6px;padding:0;list-style:none;counter-reset:t}
  .tasks li{position:relative;padding:6px 0 6px 30px;border-top:1px solid var(--line);font-size:15.5px;counter-increment:t}
  .tasks li::before{content:counter(t);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:6px;background:var(--c,var(--ink));color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center}
  /* examiner findings — hidden until you ask for them, as in the station */
  .peF{margin:2px 0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .peF>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--c,var(--ink));background:rgba(0,0,0,.02);display:flex;align-items:center;gap:8px}
  .peF>summary::-webkit-details-marker{display:none}
  .peF>summary::before{content:"+";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--c,var(--ink));color:#fff;font-size:13px;line-height:1}
  .peF[open]>summary::before{content:"\2212"}
  .peF[open]>summary{border-bottom:1px solid var(--line)}
  .peFt{width:100%;border-collapse:collapse;font-size:14px}
  .peFt th,.peFt td{text-align:left;vertical-align:top;padding:7px 12px;border-top:1px solid var(--line)}
  .peFt tr:first-child th,.peFt tr:first-child td{border-top:none}
  .peFt th{width:34%;font-weight:600;color:var(--ink-2);font-size:13px}
  .peFt td{color:var(--ink)}
  @media (max-width:520px){ .peFt th{width:40%} .peFt th,.peFt td{padding:6px 10px;font-size:13.5px} }
  .ddxw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 6px}
  .ddx{width:100%;min-width:540px;border-collapse:collapse;font-size:13.5px}
  .ddx th,.ddx td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .ddx th{background:rgba(127,127,127,.13);font-weight:600;font-size:12.5px;letter-spacing:.02em}
  .ddx td.ddxn{font-weight:700;width:20%}
  @media (max-width:520px){ .ddx{font-size:12.5px} .ddx th,.ddx td{padding:5px 7px} }
  .framing,.runsheet{font-size:15px;line-height:1.55;margin:0 0 14px;color:var(--ink)}
  .runsheet{color:var(--ink-2)}
  .timenote{font-size:13.5px;color:var(--ink-2);padding-top:8px;border-top:1px solid var(--line)}

  /* timer */
  .timer{display:flex;align-items:center;gap:16px;margin:18px 0 6px}
  .ring{position:relative;width:118px;height:118px;flex:none}
  .ring svg{transform:rotate(-90deg);width:118px;height:118px}
  .ring .bg{stroke:var(--line);fill:none;stroke-width:8}
  .ring .fg{stroke:var(--c,var(--ink));fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .ring.warn .fg{stroke:var(--warn)} .ring.done .fg{stroke:var(--bad)}
  .ring.read .fg{stroke:#2f6fb0} .ring .ph{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .ring .t{padding-bottom:6px}
  .bar.read .bt{color:#2f6fb0}
  .tbtns{display:flex;flex-direction:column;gap:8px;flex:1}
  .btn{padding:11px 14px;border-radius:10px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;text-align:center}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-2);font-weight:500}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .marks{font-size:12.5px;color:var(--ink-3);margin-top:2px}

  /* back */
  .back h3{font-size:13.5px;font-weight:600;margin:16px 0 6px;color:var(--c,var(--ink));letter-spacing:.005em}
  .back h3:first-child{margin-top:0}
  .vers{border:2px solid #4a5568;border-radius:10px;padding:10px 12px;margin:0 0 14px;background:#f7f9fc}
  .vers h3{margin:0 0 4px;color:#2d3748;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .vers .door{font-size:14px;line-height:1.45;margin:0 0 8px;color:#1a202c}
  .vers .door b{color:#b00000}
  .vers table{width:100%;border-collapse:collapse;font-size:13.5px}
  .vers th,.vers td{border-top:1px solid #cbd5e0;padding:5px 6px;vertical-align:top;text-align:left}
  .vers th{width:64px;white-space:nowrap;color:#2d3748}
  .vers td.dxc{font-weight:700;color:#1a202c;width:31%}
  .vers tr.thisv{background:#fff3b0}
  .vers tr.thisv th:after{content:" ← this card";color:#b00000;font-weight:700;white-space:nowrap}
  .vers .vnote{font-size:12.5px;color:#4a5568;margin:8px 0 0;line-height:1.4}
  .must{background:#fff3b0;border:2px solid #d00;border-radius:10px;padding:12px 16px;margin:0 0 14px}
  .must h3{margin:0 0 6px;color:#b00000;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .must ol{margin:0;padding-left:22px}
  .must li{color:#b00000;font-weight:700;font-size:15.5px;line-height:1.45;margin:4px 0}
  .mnem{border:2px solid #2563eb;border-radius:10px;padding:10px 14px;margin:0 0 14px;background:#eff6ff}
  .mnem h3{margin:0 0 6px;color:#1d4ed8;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
  .mnem table{width:100%;border-collapse:collapse;font-size:14px}
  .mnem th,.mnem td{border-top:1px solid #bfdbfe;padding:5px 7px;vertical-align:top;text-align:left}
  .mnem tr:first-child th,.mnem tr:first-child td{border-top:0}
  .mnem th{width:1%;white-space:nowrap;color:#1d4ed8;font-weight:800;font-size:13.5px;letter-spacing:.02em;padding-left:0}
  .mnem td{color:#12243a;line-height:1.5}
  .mnem td b{color:#1d4ed8}
  .mnem .mnote{font-size:12.5px;color:#3b5573;margin:8px 0 0;line-height:1.45}
  .hl{background:#fff3b0;color:#b00000;font-weight:700;border-radius:3px;padding:0 3px}
  .dx{font-family:Georgia,serif;font-size:18px;line-height:1.4;margin:0}
  .dxlead{font-family:Georgia,serif;font-size:18px;line-height:1.38;margin:0 0 9px;font-weight:600;color:var(--ink)}
  .ptl{list-style:none;margin:0;padding:0}
  .ptl li{position:relative;padding-left:15px;margin:0 0 8px;font-size:15px;line-height:1.5;color:var(--ink)}
  .ptl li:last-child{margin-bottom:0}
  .ptl li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--c,var(--ink-3));opacity:.55}
  .ptl.dxp li{font-size:15.5px;line-height:1.52}
  .ptl.runp li{color:var(--ink-2)}
  .back ul{margin:0;padding-left:18px;font-size:14.5px}
  .back li{margin:3px 0}
  .fail li::marker{color:var(--bad)}
  .tl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
  .tl b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .src{font-size:12px;color:var(--ink-3);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);word-break:break-all}
  .drive{font-size:10px;color:var(--ink-3);opacity:.75;margin-top:4px;word-break:break-all}
  .approx{font-size:12px;color:var(--ink-3);font-weight:400}

  /* ratings */
  .rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
  .rate button{padding:12px 4px;border-radius:10px;font-weight:600;font-size:14.5px;color:#fff}
  .rate .again{background:var(--bad)} .rate .hard{background:var(--warn)} .rate .good{background:var(--ok)} .rate .easy{background:#2F6E9E}
  .rate small{display:block;font-weight:400;font-size:11.5px;opacity:.85;margin-top:2px}

  .empty{padding:40px 18px;text-align:center;color:var(--ink-2);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
  .row{display:flex;gap:8px;margin-top:12px}
  .row .btn{flex:1}
  .status{font-size:12.5px;color:var(--ink-3);margin:10px 2px 0;display:flex;justify-content:space-between;gap:10px}

  /* drawer */
  .drawer{position:fixed;inset:0;background:rgba(20,24,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .drawer.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:18px 18px 0 0;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}
  @media (min-width:900px){ .drawer{align-items:center} .sheet{border-radius:18px;max-height:80vh} }
  .sheet h2{font-size:17px;margin:0 0 6px}
  .sheet p{font-size:14px;color:var(--ink-2);margin:6px 0 10px}
  .sheet label{display:flex;align-items:center;gap:10px;font-size:15px;padding:10px 0;border-top:1px solid var(--line)}
  .sheet input[type=checkbox]{width:20px;height:20px}
  .sheet input[type=number]{width:88px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:16px/1.4 inherit;text-align:center;font-variant-numeric:tabular-nums}
  .sheet input[type=password],.sheet input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:0 0 8px}
  .hint{font-size:13px;color:#667085;margin:0 0 8px}
  textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:16px/1.4 ui-monospace,Menlo,Consolas,monospace}
  .stats{display:grid;grid-template-columns:1fr auto auto auto auto;gap:4px 10px;font-size:14px;margin:8px 0 14px}
  .stats span{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
  .stats .h{color:var(--ink-3);font-size:12px}
  /* phone/iPad-portrait: a slim bar pinned to the bottom so the clock stays visible while the stem scrolls */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;padding:8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .bar .bt{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px;color:var(--c,var(--ink))}
  .bar.warn .bt{color:var(--warn)} .bar.done .bt{color:var(--bad)}
  .bar .btn{flex:1;padding:10px 12px}
  .app.hasbar{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  @media (min-width:900px){.bar{display:none}.app.hasbar{padding-bottom:40px}}
  @media (prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<aside class="bk" id="bk" hidden aria-label="Backlog"></aside>

<div class="drawer" id="drawer" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Settings">
    <h2>Progress</h2>
    <div class="stats" id="stats"></div>
    <h2>Settings</h2>
    <label><input type="checkbox" id="optPrep"> Reading time: 2 minutes before each station, with a bell to start</label>
    <label><input type="checkbox" id="optBell"> Bells: 5:00 prompt (where the station has one), 6:00 two-minute warning, 8:00 finish</label>
    <label><input type="checkbox" id="optStudy"> Study mode: allow flipping without the timer</label>
    <label><input type="checkbox" id="optShuffle"> Shuffle order</label>
    <label style="justify-content:space-between"><span>Daily target &mdash; stations a day, counted on the Adelaide day</span><input type="number" id="optGoal" min="1" max="500" step="5" inputmode="numeric"></label>
    <h2 style="margin-top:18px">Sync across devices</h2>
    <p class="hint" id="syncState">Not connected — ratings stay on this device only.</p>
    <input id="syncTok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="GitHub token with gist access">
    <div class="row"><button class="btn" id="syncConnect">Connect</button><button class="btn ghost" id="syncBtn">Sync now</button><button class="btn ghost" id="syncOff">Disconnect</button></div>
    <h2 style="margin-top:18px">Add stations</h2>
    <p>Paste a JSON block of stations here, or the progress JSON copied from another copy of this deck. Stations with the same id are replaced; progress is merged, newest rating wins.</p>
    <textarea id="importBox" placeholder='[{"id":"MED-01","cat":"med", ...}]'></textarea>
    <div class="row"><button class="btn" id="importBtn">Add stations</button><button class="btn ghost" id="exportBtn">Copy progress JSON</button></div>
    <p id="importMsg"></p>
    <div class="row"><button class="btn ghost" id="resetBtn">Reset all progress</button><button class="btn ghost" id="closeBtn">Close</button></div>
  </div>
</div>

<script>
/* ===================== Categories ===================== */
const CATS = {
  pe:    {name:"Physical exam", color:"var(--pe)"},
  med:   {name:"Medicine",      color:"var(--med)"},
  og:    {name:"Obs & Gynae",   color:"var(--og)"},
  paeds: {name:"Paediatrics",   color:"var(--paeds)"},
  psych: {name:"Psychiatry",    color:"var(--psych)"},
  couns: {name:"Counselling",   color:"var(--couns)"}
};

/* ===================== Built-in stations =====================
   Front: verbatim door stem + tasks only. Back: the brief.
   Each has "source" = the Part 2 PDF in Drive it was taken from, and "drive" = its Google Drive folder path › filename (shown small on the back). */
let BUILTIN = [];

/* ===================== State & storage ===================== */
const KEY_PROG="amc_osce_progress", KEY_CUSTOM="amc_osce_custom_cards", KEY_OPTS="amc_osce_opts", KEY_SYNC="amc_osce_sync", KEY_DAYS="amc_osce_days";
let progress={}, custom=[], days={}, opts={bell:true, study:false, shuffle:false, prep:true, goal:60, debtFrom:null};
let cards=[], queue=[], idx=0, flipped=false, mode="due", catSel=new Set(Object.keys(CATS));
let timerId=null, remaining=480, timerDone=false, fired={}, phase="station";
const PREP=120, STATION=480;
const phaseTotal=()=>phase==="prep"?PREP:STATION;
/* Storage adapter: Claude artifact storage when present; otherwise the browser's own
   storage when the file is opened directly in Safari/Chrome; otherwise memory only. */
const store=(()=>{
  if(typeof window.storage!=="undefined" && window.storage && typeof window.storage.get==="function")
    return {kind:"claude", get:async k=>{ const r=await window.storage.get(k,false); return r&&r.value?r.value:null; }, set:async(k,v)=>window.storage.set(k,v,false)};
  try{ const t="__t"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t);
    return {kind:"browser", get:async k=>window.localStorage.getItem(k), set:async(k,v)=>window.localStorage.setItem(k,v)}; }catch(e){}
  const mem={}; return {kind:"none", get:async k=>mem[k]||null, set:async(k,v)=>{mem[k]=v;}};
})();
const hasStore = store.kind!=="none";

async function load(){
  for (const [k,fn] of [[KEY_PROG,v=>progress=v],[KEY_CUSTOM,v=>custom=v],[KEY_DAYS,v=>days=v],[KEY_OPTS,v=>opts=Object.assign(opts,v)],[KEY_SYNC,v=>sync=Object.assign(sync,v)]]){
    try{ const r=await store.get(k); if(r) fn(JSON.parse(r)); }catch(e){ /* key absent on first run */ }
  }
}
async function save(k,v){
  try{ await store.set(k,JSON.stringify(v)); }catch(e){ console.error("save failed",k,e); setStatus("Could not save — storage unavailable"); }
}
/* The day rolls over at midnight in Adelaide, not UTC and not on the device clock,
   so a card rated at 11pm counts for that day on the laptop and the iPad alike. */
const TZ="Australia/Adelaide";
function localDay(d){
  d=d||new Date();
  try{
    const p={};
    new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"})
      .formatToParts(d).forEach(x=>{p[x.type]=x.value;});
    if(p.year&&p.month&&p.day) return p.year+"-"+p.month+"-"+p.day;
  }catch(e){}
  const z=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function today(){ return localDay(); }
/* stations rated today, Adelaide time — one per station, however many times it was turned */
function doneToday(){
  const t=today(); let n=0;
  Object.values(progress).forEach(p=>{ if(p&&p.at&&localDay(new Date(p.at))===t) n++; });
  return n;
}
function dailyGoal(){ return Math.max(1,parseInt(opts.goal,10)||60); }

/* ===================== Backlog =====================
   A day that falls short of the target leaves its shortfall behind, and the
   shortfalls stack up. A day that overshoots pays some of the pile back. The
   ledger is per-day and local to the device: only today's figure is recomputed
   from progress, so past days stay frozen once they roll over. */
let bkOpen=false;
function dayMs(d){ const a=String(d).split("-").map(Number); return Date.UTC(a[0],a[1]-1,a[2],2,0,0); }
function markToday(){
  const t=today(), n=doneToday(), was=days[t]||0;
  if(n>was){ days[t]=n; save(KEY_DAYS,days); }
  else if(!(t in days)){ days[t]=n; save(KEY_DAYS,days); }
}
function backlogInfo(){
  const g=dailyGoal(), t=today(), from=opts.debtFrom||t;
  let carried=0, rows=[], ms=dayMs(from), guard=0;
  while(guard++<600){
    const d=localDay(new Date(ms)); if(d>=t) break;
    const n=days[d]||0;
    carried=Math.max(0,carried+(g-n));
    rows.push([d,n,Math.max(0,g-n)]);
    ms+=86400000;
  }
  const n=doneToday(), todayLeft=Math.max(0,g-n), surplus=Math.max(0,n-g);
  /* what is owed at this moment: everything carried in, less anything paid back today,
     plus whatever is still outstanding on today's target */
  return {carried:Math.max(0,carried-surplus), todayLeft, doneToday:n, surplus,
          owed:Math.max(0,carried-surplus)+todayLeft, rows:rows.slice(-14)};
}
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function backlogHTML(b){
  const g=dailyGoal(), clear=b.owed===0;
  const last=b.rows.slice(-7);
  const ticks=(last.length?last:[["",0,0]]).map(r=>{
    const h=Math.max(2,Math.round(Math.min(1,(r[1]||0)/g)*22));
    return `<i style="height:22px"><span style="height:${h}px"></span></i>`;
  }).join("");
  const lbl=d=>WD[new Date(dayMs(d)).getUTCDay()]+" "+d.slice(8);
  return `<div class="mini">
      <div class="bkn${clear?" ok":(b.carried?" bad":"")}">${clear?"&#10003;":b.owed}</div>
      <div class="bkl">${clear?"clear":"to clear"}</div>
      ${b.carried?`<div class="bkc">${b.carried} carried</div>`:""}
      <div class="ticks">${ticks}</div></div>
  <div class="panel"><h4>Still to clear &middot; Adelaide</h4>
    <div class="tot${clear?" ok":""}">${b.owed} <small>station${b.owed===1?"":"s"}</small></div>
    <table>
      <tr><td class="d">Today</td><td>${b.doneToday} / ${g}</td><td class="s ${b.todayLeft?"":"z"}">${b.todayLeft?"+"+b.todayLeft:"done"}</td></tr>
      ${b.carried?`<tr><td class="d">Carried in</td><td>from earlier days</td><td class="s">+${b.carried}</td></tr>`:""}
    </table>
    ${b.surplus?`<div class="paid">&minus;${b.surplus} over target today, paying the pile down</div>`:""}
    ${b.rows.length?`<h4 style="margin-top:12px">Past days</h4><table>${b.rows.slice().reverse().map(r=>`<tr><td class="d">${lbl(r[0])}</td><td>${r[1]} / ${g}</td><td class="s ${r[2]?"":"z"}">${r[2]?"+"+r[2]:"clear"}</td></tr>`).join("")}</table>`:`<p class="hint">Days that fall short start stacking up here from tomorrow.</p>`}
    <p class="hint">Days over the target pay the pile down. Wiping the slate starts the count again from today.</p>
    <div class="bkbtn"><button id="bkClear">Wipe the slate</button><button id="bkClose">Close</button></div></div>`;
}
function paintBacklog(){
  const el=document.getElementById("bk"); if(!el) return;
  const b=backlogInfo();
  el.hidden=false; el.className="bk"+(bkOpen?" open":"");
  el.innerHTML=backlogHTML(b);
  document.body.classList.add("hasbk");
}

/* ===================== Cross-device sync (private GitHub gist) =====================
   Ratings are mirrored to a secret gist on your own GitHub account. The token is
   typed in on each device and kept in that device's storage only — it is never part
   of this file and never reaches the repo. Merge rule: per station, the rating with
   the newer timestamp wins, so a stale device can never wipe a fresher one. */
const GIST_FILE="amc-deck-progress.json", GIST_DESC="AMC-DECK progress sync (do not delete)";
let sync={token:"",gistId:"",last:""}, syncTimer=null, syncBusy=false, syncLastAuto=0;
function syncOn(){ return !!sync.token; }

async function gh(path,o){
  o=o||{};
  const hd=Object.assign({"Authorization":"Bearer "+sync.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},o.headers||{});
  const r=await fetch("https://api.github.com"+path,Object.assign({},o,{headers:hd}));
  if(!r.ok) throw new Error(r.status===401?"token rejected":r.status===403||r.status===404?"token lacks gist access":"HTTP "+r.status);
  return r.json();
}

async function ensureGist(){
  if(sync.gistId) return sync.gistId;
  const list=await gh("/gists?per_page=100");
  const found=(list||[]).find(g=>g.files&&g.files[GIST_FILE]);
  if(found) sync.gistId=found.id;
  else{
    const g=await gh("/gists",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify({progress:{},custom:[],at:new Date().toISOString()})}}})});
    sync.gistId=g.id;
  }
  await save(KEY_SYNC,sync);
  return sync.gistId;
}

function mergeRemote(remote){
  let n=0;
  Object.entries(remote||{}).forEach(([id,p])=>{
    const cur=progress[id];
    if(p && (!cur || ((p.at||"") > (cur.at||"")))){ progress[id]=p; n++; }
  });
  return n;
}

async function syncPull(){
  const id=await ensureGist();
  const g=await gh("/gists/"+id);
  const f=g.files&&g.files[GIST_FILE]; if(!f) return 0;
  let txt=f.content;
  if(f.truncated&&f.raw_url){ const r=await fetch(f.raw_url,{cache:"no-store"}); txt=await r.text(); }
  const data=JSON.parse(txt||"{}");
  const n=mergeRemote(data.progress);
  if(Array.isArray(data.custom)&&data.custom.length){
    const map=new Map(data.custom.map(c=>[c.id,c])); custom.forEach(c=>map.set(c.id,c)); custom=[...map.values()];
    await save(KEY_CUSTOM,custom);
  }
  return n;
}

async function syncPush(){
  const id=await ensureGist();
  await gh("/gists/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify({progress,custom,at:new Date().toISOString()})}}})});
  sync.last=new Date().toISOString(); await save(KEY_SYNC,sync);
}

async function syncNow(quiet){
  if(!syncOn()||syncBusy) return;
  syncBusy=true; syncLastAuto=Date.now();
  if(!quiet) setStatus("Syncing…");
  try{
    const n=await syncPull();
    if(n){ await save(KEY_PROG,progress); buildCards(); buildQueue(); render(); }
    await syncPush();
    setStatus(n?("Synced — "+n+" station"+(n===1?"":"s")+" brought in from your other device"):"Synced");
  }catch(e){ setStatus("Sync failed — "+e.message); }
  finally{ syncBusy=false; renderSyncState(); }
}

function syncSoon(){
  if(!syncOn()) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ syncPush().then(renderSyncState).catch(e=>setStatus("Sync failed — "+e.message)); },2500);
}

async function armSyncFromHash(){
  const m=/[#&]sync=([^&]*)/.exec(location.hash||""); if(!m) return;
  const v=decodeURIComponent(m[1]||"").trim(); if(!v) return;
  const i=v.indexOf(":");
  sync.token = i<0 ? v : v.slice(0,i);
  if(i>=0 && v.slice(i+1)) sync.gistId=v.slice(i+1);
  await save(KEY_SYNC,sync);
  try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; }
}

function renderSyncState(){
  const el=document.getElementById("syncState"); if(!el) return;
  if(!syncOn()){ el.textContent="Not connected — ratings stay on this device only."; return; }
  el.textContent="Connected"+(sync.gistId?" · gist "+sync.gistId.slice(0,8):"")+(sync.last?" · last synced "+sync.last.slice(0,16).replace("T"," "):"");
}


function buildCards(){
  const map=new Map(BUILTIN.map(c=>[c.id,c]));
  custom.forEach(c=>{ if(c&&c.id) map.set(c.id,c); });
  cards=[...map.values()];
}
function prog(id){ return progress[id]||{reps:0,ease:2.5,interval:0,due:null,last:null,seen:0}; }
function isDue(c){ const p=prog(c.id); return !p.due || p.due<=today(); }
function isHard(c){ const p=prog(c.id); return p.last==="again"||p.last==="hard"; }
function isOk(c){ const p=prog(c.id); return p.last==="good"||p.last==="easy"; }

function buildQueue(){
  let list=cards.filter(c=>catSel.has(c.cat));
  if(mode==="due") list=list.filter(isDue);
  else if(mode==="hard") list=list.filter(isHard);
  else if(mode==="ok") list=list.filter(isOk);
  if(opts.shuffle){ for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; } }
  else list.sort((a,b)=>a.id.localeCompare(b.id));
  queue=list; idx=0; flipped=false; resetTimer();
}

/* ===================== Scheduling (SM-2 style) ===================== */
function rate(r){
  const c=queue[idx]; if(!c) return;
  const p=prog(c.id); let {ease,interval}=p;
  if(r==="again"){ ease=Math.max(1.3,ease-0.2); interval=0; }
  else if(r==="hard"){ ease=Math.max(1.3,ease-0.15); interval=interval===0?1:Math.max(1,Math.round(interval*1.2)); }
  else if(r==="good"){ interval=interval===0?2:Math.round(interval*ease); }
  else { ease=ease+0.15; interval=interval===0?3:Math.round(interval*ease*1.3); }
  const d=new Date(); d.setDate(d.getDate()+interval);
  progress[c.id]={reps:p.reps+1,ease,interval,due:interval===0?today():localDay(d),last:r,seen:(p.seen||0)+1,at:new Date().toISOString()};
  save(KEY_PROG,progress); markToday(); syncSoon();
  // Again keeps the card in this session: move it to the end of the queue
  if(r==="again"){ queue.push(queue.splice(idx,1)[0]); }
  else { idx++; }
  flipped=false; resetTimer(); render();
}

/* ===================== Timer ===================== */
let audioCtx=null;
function beep(freq=880,dur=0.35,times=1){
  if(!opts.bell) return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+i*(dur+0.15);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur+0.05);
    }
  }catch(e){}
}
let endAt=null, wakeLock=null;
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }
async function keepAwake(){ try{ if("wakeLock" in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } }catch(e){} }
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(timerId) keepAwake(); tick(); } });

function resetTimer(){ clearInterval(timerId); timerId=null; endAt=null; phase=opts.prep?"prep":"station"; remaining=phaseTotal(); timerDone=false; fired={}; releaseWake(); }
function beginStation(run){ phase="station"; remaining=STATION; fired={}; if(run){ endAt=Date.now()+STATION*1000; } }
function skipReading(){ if(phase!=="prep") return; const wasRunning=!!timerId; beginStation(wasRunning); if(wasRunning){ render(); } else { startTimer(); } }
function tick(){
  if(!timerId||endAt===null) return;
  // derive from the clock, so the count stays right if the tab is throttled or the screen locks
  const left=Math.max(0,Math.round((endAt-Date.now())/1000));
  if(phase==="prep"){
    remaining=left;
    if(left<=0){ const base=endAt; beep(740,0.5,2); buzz([250,120,250]); phase="station"; fired={}; endAt=base+STATION*1000; remaining=Math.max(0,Math.round((endAt-Date.now())/1000)); render(); return; }
    updateTimerUI(); return;
  }
  const c=queue[idx];
  const pAt=c?(c.promptAt?480-c.promptAt:(c.promptBell?180:0)):0;
  if(pAt&&left<=pAt&&!fired.p){ fired.p=1; beep(660,0.5,1); buzz([300]); }
  if(left<=120&&!fired.w){ fired.w=1; beep(880,0.25,2); buzz([150,100,150]); }
  remaining=left;
  if(left<=0){ clearInterval(timerId); timerId=null; endAt=null; timerDone=true; beep(523,0.6,3); buzz([400,120,400,120,400]); releaseWake(); render(); return; }
  updateTimerUI();
}
function startTimer(){
  if(timerId||timerDone) return;
  if(opts.bell){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
  endAt=Date.now()+remaining*1000;
  timerId=setInterval(tick,250);
  keepAwake();
  render();
}
function pauseTimer(){ if(timerId){ remaining=Math.max(0,Math.round((endAt-Date.now())/1000)); } clearInterval(timerId); timerId=null; endAt=null; releaseWake(); render(); }

/* Keyboard shortcuts for desktop Chrome: space = start/pause, enter = turn card, 1–4 = rate, ← → = previous/skip */
document.addEventListener("keydown",e=>{
  if(document.getElementById("drawer").classList.contains("open")) return;
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key===" "){ e.preventDefault(); if(flipped) return; timerId?pauseTimer():startTimer(); }
  else if(e.key==="Enter"){ const f=document.getElementById("flip"); if(f) f.click(); }
  else if(/^[1-4]$/.test(e.key)&&flipped){ rate(["again","hard","good","easy"][+e.key-1]); }
  else if(e.key==="ArrowLeft"){ const b=document.getElementById("prev"); if(b&&!b.disabled) b.click(); }
  else if(e.key==="ArrowRight"){ const b=document.getElementById("skip"); if(b&&!b.disabled) b.click(); }
});
function fmt(s){ return String(Math.floor(s/60)).padStart(1,"0")+":"+String(s%60).padStart(2,"0"); }
function updateTimerUI(){
  const t=document.getElementById("tt"), fg=document.getElementById("fg"), ring=document.getElementById("ring");
  if(!t) return;
  t.textContent=fmt(remaining);
  const C=2*Math.PI*52; fg.style.strokeDashoffset=C*(1-remaining/phaseTotal());
  const warn=phase==="station"&&remaining<=120;
  ring.className="ring"+(timerDone?" done":phase==="prep"?" read":warn?" warn":"");
  const ph=document.getElementById("ph"); if(ph) ph.textContent=phase==="prep"?"Reading":"Station";
  const t2=document.getElementById("tt2"), bar=document.getElementById("bar");
  if(t2){ t2.textContent=fmt(remaining); bar.className="bar"+(timerDone?" done":phase==="prep"?" read":warn?" warn":""); }
}

/* ===================== Render ===================== */
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const escb=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
function setStatus(m){ const s=document.getElementById("statusMsg"); if(s) s.textContent=m; }

function goalHTML(){
  const g=dailyGoal(), n=doneToday(), left=Math.max(0,g-n), pct=Math.min(100,Math.round(n/g*100));
  const unseen=cards.filter(c=>!(progress[c.id]&&progress[c.id].seen)).length;
  return `<div class="g1"><span class="lbl">Today &middot; Adelaide</span><span class="num">${n} <span class="of">/ ${g}</span></span></div>
    <div class="gbar"><i style="width:${pct}%"></i></div>
    <div class="g2"><span class="left">${left?`<b>${left}</b> still to do today`:`Target met &mdash; ${n} done today`}</span>
    <span>${unseen} never turned &middot; ${cards.length} in the deck</span></div>`;
}
function paintGoal(){
  const el=document.getElementById("goal"); if(!el) return;
  el.className="goal"+(doneToday()>=dailyGoal()?" done":"");
  el.innerHTML=goalHTML();
  paintBacklog();
}
/* keeps the count honest if the app is left open across midnight */
setInterval(()=>{ markToday(); paintGoal(); paintBacklog(); },30000);

function render(){
  const app=document.getElementById("app");
  const counts={}; Object.keys(CATS).forEach(k=>counts[k]={all:0,due:0,hard:0});
  cards.forEach(c=>{ if(!counts[c.cat]) return; counts[c.cat].all++; if(isDue(c)) counts[c.cat].due++; if(isHard(c)) counts[c.cat].hard++; });

  let h=`<div class="goal${doneToday()>=dailyGoal()?" done":""}" id="goal">${goalHTML()}</div>`;
  h+=`<div class="top"><div><h1>AMC OSCE station deck</h1><div class="sub">${cards.length} stations · ${cards.filter(isDue).length} due today · ${cards.filter(isHard).length} in the hard pile &middot; ${cards.filter(isOk).length} good or easy</div></div>
    <button class="iconbtn" id="gear" aria-label="Settings and progress">⚙</button></div>`;
  h+=`<div class="filters">`+Object.entries(CATS).map(([k,v])=>`<button class="chip ${catSel.has(k)?"on":""}" data-cat="${k}" style="--c:${v.color}"><span class="dot"></span>${v.name}<span class="n">${counts[k].all}</span></button>`).join("")+`</div>`;
  h+=`<div class="modes"><button data-mode="due" class="${mode==="due"?"on":""}">Due</button><button data-mode="hard" class="${mode==="hard"?"on":""}">Hard pile</button><button data-mode="ok" class="${mode==="ok"?"on":""}">Good &amp; easy</button><button data-mode="all" class="${mode==="all"?"on":""}">All</button></div>`;

  const c=queue[idx];
  if(!c){
    const msg = cards.length===0 ? "No stations yet. Open settings to add a block." :
      mode==="due" ? "Nothing due in the selected categories. Switch to All to keep practising, or come back tomorrow." :
      mode==="hard" ? "The hard pile is empty for these categories." :
      mode==="ok" ? "Nothing marked good or easy in these categories yet." : "No stations in the selected categories.";
    h+=`<div class="empty">${msg}</div>`;
  } else {
    const col=CATS[c.cat]?CATS[c.cat].color:"var(--ink-3)", p=prog(c.id);
    const timerHtml=`<div class="timer"><div class="ring" id="ring"><svg viewBox="0 0 118 118"><circle class="bg" cx="59" cy="59" r="52"/><circle class="fg" id="fg" cx="59" cy="59" r="52" stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="0"/></svg><div class="t" id="tt">${fmt(remaining)}</div><div class="ph" id="ph">${phase==="prep"?"Reading":"Station"}</div></div>
          <div class="tbtns">
            ${timerDone?`<button class="btn" id="flip">Turn the card</button>`:
              timerId?`<button class="btn ghost" id="pause">Pause</button>`:`<button class="btn" id="start">${remaining<phaseTotal()?"Resume":phase==="prep"?"Start 2-minute reading":"Start 8 minutes"}</button>`}
            ${phase==="prep"&&!timerDone?`<button class="btn ghost" id="skipRead">Skip reading — start 8 minutes</button>`:""}
            <button class="btn ghost" id="reset">Reset timer</button>
            ${opts.study&&!timerDone?`<button class="btn ghost" id="flip">Turn the card now</button>`:""}
          </div></div>
        <div class="marks">${opts.prep?"2-minute reading · ":""}${c.promptAt?`Prompt at ${fmt(c.promptAt)} · `:c.promptBell?"Prompt bell at 5:00 · ":""}Two-minute warning at 6:00 · Finish at 8:00${opts.bell?"":" (bells off)"}</div>`;
    const rateHtml=`<div class="rate">
        <button class="again" data-r="again">Again<small>repeat now</small></button>
        <button class="hard" data-r="hard">Hard<small>${fmtIv(p,"hard")}</small></button>
        <button class="good" data-r="good">Good<small>${fmtIv(p,"good")}</small></button>
        <button class="easy" data-r="easy">Easy<small>${fmtIv(p,"easy")}</small></button>
      </div>
      <div class="row"><button class="btn ghost" id="unflip">Back to the stem</button></div>`;
    const navHtml=`<div class="row"><button class="btn ghost" id="prev" ${idx===0?"disabled":""}>Previous</button><button class="btn ghost" id="skip" ${idx>=queue.length-1?"disabled":""}>Skip</button></div>`;
    const wide=window.matchMedia("(min-width:900px)").matches;

    h+=`<div class="cols"><div class="main"><div class="station" style="--c:${col}">
      <div class="meta"><span class="cat">${CATS[c.cat]?CATS[c.cat].name:c.cat}</span><span class="idn">${esc(c.id)} · ${idx+1} of ${queue.length}${p.seen?` · seen ${p.seen}×`:""}</span></div>`;
    if(!flipped){
      h+=`<div class="stem">${(c.stem||[]).map(s=>`<p>${esc(s)}</p>`).join("")}</div>
        <ol class="tasks">${(c.tasks||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
        ${c.findings?`<details class="peF"><summary>${esc(c.findingsLabel||"Examination findings — open only when you would ask the examiner")}</summary><table class="peFt">${c.findings.map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table></details>`:""}
        ${wide?"":timerHtml}`;
    } else {
      const b=c.back||{};
    const mustKeys=new Set((c.must||[]).map(m=>m.replace(/^(FAIL|SAY|DO|ASK) — /,"").replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,60)));
    const isMust=(t)=>{const k=(t||"").replace(/★/g,"").replace(/[^a-z0-9]/gi,"").toLowerCase().slice(0,60);return k.length>20&&mustKeys.has(k);};
    const V2=c.v2===true;
    const li=(t)=>`<li${isMust(t)?' class="hl"':''}>${escb(t)}</li>`;
      h+=`<div class="back">
        ${c.must&&c.must.length?`<div class="must"><h3>${V2?"Must remember":"6 must remember"}</h3><ol>${c.must.map(m=>`<li>${escb(m)}</li>`).join("")}</ol></div>`:""}
        ${c.mnem&&c.mnem.rows&&c.mnem.rows.length?`<div class="mnem"><h3>${esc(c.mnem.title||"History scaffold")}</h3><table>${c.mnem.rows.map(([k,v])=>`<tr><th>${escb(k)}</th><td>${escb(v)}</td></tr>`).join("")}</table>${c.mnem.note?`<p class="mnote">${escb(c.mnem.note)}</p>`:""}</div>`:""}
        ${c.versions&&c.versions.rows&&c.versions.rows.length?`<div class="vers"><h3>Versions this stem has produced</h3>${c.versions.doorStem?`<p class="door"><b>On the door:</b> ${esc(c.versions.doorStem)}</p>`:""}<table>${c.versions.rows.map(([v,clue,dx])=>`<tr class="${c.versions.thisCard&&v.split(" ")[0]===c.versions.thisCard?"thisv":""}"><th>${escb(v)}</th><td>${escb(clue)}</td><td class="dxc">${escb(dx)}</td></tr>`).join("")}</table>${c.versions.note?`<p class="vnote">${esc(c.versions.note)}</p>`:""}</div>`:""}
        ${!V2&&c.setting?`<h3>How the station runs</h3>${ptlist(c.setting,"",140,320)}`:""}
        <h3>Diagnosis</h3>${(()=>{const p=Array.isArray(b.dx)?b.dx.filter(Boolean):points(b.dx||"");if(!p.length)return "";return `<p class="dxlead">${escb(p[0])}</p>`+(p.length>1?`<ul class="ptl dxp">${p.slice(1).map(x=>`<li>${escb(x)}</li>`).join("")}</ul>`:"");})()}
        ${!V2&&c.time?`<h3>The eight minutes, end to end</h3>${runpoints(c.time)}`:""}
        ${b.plan?`<h3>Time plan ${!V2&&b.planApprox?`<span class="approx">(approximate — ${esc(b.planNote||"the source gives no minute plan")})</span>`:""}</h3><div class="tl">${b.plan.map(([t,x])=>`<b>${escb(t)}</b><span${isMust(x)?' class="hl"':''}>${escb(x)}</span>`).join("")}</div>`:""}
        ${!V2&&b.ask?`<h3>Must-ask questions</h3><ul>${b.ask.map(li).join("")}</ul>`:""}
        ${b.pefe?`<h3>Examination / investigations to request</h3><ul>${b.pefe.map(li).join("")}</ul>`:""}
        ${b.ddx&&b.ddx.length?`<h3>Differentials</h3><div class="ddxw"><table class="ddx"><tr><th>Differential</th><th>Clues supporting</th><th>Ask / look for</th><th>Next step</th></tr>${b.ddx.map(r=>`<tr><td class="ddxn">${escb(r[0]||"")}</td><td>${escb(r[1]||"")}</td><td>${escb(r[2]||"")}</td><td>${escb(r[3]||"")}</td></tr>`).join("")}</table></div>`:""}
        ${!V2&&b.fails?`<h3>Immediate fails</h3><ul class="fail">${b.fails.map(li).join("")}</ul>`:""}
        ${!V2&&b.numbers?`<h3>Numbers and lines</h3><ul>${b.numbers.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
        <div class="src">Source: ${esc(c.source||"")}</div>${c.drive?`<div class="drive">Google Drive: ${esc(c.drive)}</div>`:""}
      </div>${wide?"":rateHtml}`;
    }
    h+=`</div>${wide?"":navHtml}</div>`;
    h+=`<div class="side">${wide?(flipped?`<div class="station" style="--c:${col}">${rateHtml}</div>`:`<div class="station" style="--c:${col}">${timerHtml}</div>`)+navHtml:""}</div></div>`;
    if(!wide&&!flipped){
      h+=`<div class="bar${phase==="prep"?" read":""}" id="bar" style="--c:${col}"><div class="bt" id="tt2">${fmt(remaining)}</div>
        ${timerDone?`<button class="btn" id="flip2">Turn the card</button>`:timerId?`<button class="btn ghost" id="pause2">Pause</button>`:`<button class="btn" id="start2">${remaining<phaseTotal()?"Resume":phase==="prep"?"Read":"Start"}</button>`}
        ${phase==="prep"&&!timerDone?`<button class="btn ghost" id="skipRead2" style="flex:0 0 auto">Skip</button>`:""}
        <button class="btn ghost" id="reset2" style="flex:0 0 auto">Reset</button></div>`;
    }
  }
  h+=`<div class="status"><span id="statusMsg">${hasStore?"Progress saves automatically":"Storage unavailable — progress will not persist"}</span><span>${today()}</span></div>`;
  app.innerHTML=h;
  app.classList.toggle("hasbar",!!document.getElementById("bar"));

  // wire
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ const k=b.dataset.cat; if(catSel.has(k)&&catSel.size>1) catSel.delete(k); else catSel.add(k); buildQueue(); render(); });
  app.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; buildQueue(); render(); });
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };
  on("start",startTimer); on("pause",pauseTimer); on("reset",()=>{resetTimer();render();});
  on("skipRead",skipReading); on("skipRead2",skipReading);
  on("start2",startTimer); on("pause2",pauseTimer); on("reset2",()=>{resetTimer();render();});
  on("flip2",()=>{ const f=document.getElementById("flip"); if(f) f.click(); });
  on("flip",()=>{ flipped=true; clearInterval(timerId); timerId=null; render(); window.scrollTo({top:0}); });
  on("unflip",()=>{ flipped=false; render(); });
  on("prev",()=>{ if(idx>0){ idx--; flipped=false; resetTimer(); render(); } });
  on("skip",()=>{ if(idx<queue.length-1){ idx++; flipped=false; resetTimer(); render(); } });
  app.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>rate(b.dataset.r));
  on("gear",openDrawer);
  updateTimerUI();
  paintBacklog();
}
function fmtIv(p,r){
  let {ease,interval}=p, iv;
  if(r==="hard") iv=interval===0?1:Math.max(1,Math.round(interval*1.2));
  else if(r==="good") iv=interval===0?2:Math.round(interval*ease);
  else iv=interval===0?3:Math.round(interval*ease*1.3);
  return iv===1?"1 day":iv<30?`${iv} days`:`${Math.round(iv/30)} mo`;
}

  try{

      // a progress export from another copy of the deck: merge progress (keep the more recent per station) and any custom stations
      let n=0; Object.entries(data.progress||{}).forEach(([id,p])=>{ const cur=progress[id]; if(!cur||(p.at||"")>(cur.at||"")){ progress[id]=p; n++; } });
      await save(KEY_PROG,progress);
      data=Array.isArray(data.custom)?data.custom:[];
      if(!data.length){ buildQueue(); render(); msg.textContent=`Progress imported for ${n} station${n===1?"":"s"}.`; box.value=""; return; }
    }

    const bad=data.find(c=>!c.id||!c.cat||!CATS[c.cat]||!Array.isArray(c.stem)||!Array.isArray(c.tasks));
    if(bad){ msg.textContent="Each station needs id, cat (pe/med/og/paeds/psych/couns), stem[] and tasks[]."; return; }
    const map=new Map(custom.map(c=>[c.id,c])); data.forEach(c=>map.set(c.id,c)); custom=[...map.values()];
    await save(KEY_CUSTOM,custom); buildCards(); buildQueue(); render();
    msg.textContent=`Added ${data.length} station${data.length===1?"":"s"}. Deck now has ${cards.length}.`; box.value="";
  }catch(e){ msg.textContent="That isn't valid JSON — check for a missing bracket or comma."; }
};

/* ---- prose to points: split long blocks into readable bullets ---- */
function _sent(s){
  const out=[]; let cur="";
  for(let i=0;i<s.length;i++){
    const ch=s[i]; cur+=ch;
    if(ch==="."||ch==="!"||ch==="?"){
      const prev=s[i-1]||"";
      let j=i+1;
      while(j<s.length&&(s[j]==="'"||s[j]==='"')){ cur+=s[j]; j++; }
      const nx=s[j]||"", nx2=s[j+1]||"";
      if(/\d/.test(prev)&&/\d/.test(nx)){ i=j-1; continue; }
      if(nx===" "&&/[A-Z'"(\u2018\u201C]/.test(nx2)){ out.push(cur.trim()); cur=""; i=j; }
      else { i=j-1; }
    }
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function _chop(t,max){
  if(t.length<=max) return [t];
  const semi=t.indexOf("; ")>-1, sep=semi?"; ":" \u2014 ";
  const bits=t.split(semi?/;\s+/:/\s+\u2014\s+/);
  if(bits.length<2) return [t];
  const out=[]; let cur="";
  for(const b of bits){
    if(!cur) cur=b;
    else if((cur+sep+b).length<=max) cur+=sep+b;
    else { out.push(cur); cur=b; }
  }
  if(cur) out.push(cur);
  return out;
}
function points(s,min,max){
  min=min||150; max=max||340;
  const raw=[];
  for(const t of _sent(s||"")){
    const caps=/^[A-Z][A-Z0-9'\u2014 ,-]{2,}/.test(t);
    if(!raw.length){ raw.push(t); continue; }
    const cur=raw[raw.length-1];
    if((caps&&cur.length>60)||cur.length>=min) raw.push(t);
    else raw[raw.length-1]=cur+" "+t;
  }
  const out=[]; raw.forEach(t=>_chop(t,max).forEach(x=>out.push(x)));
  return out;
}
function ptlist(s,cls,min,max){
  const p=points(s,min,max);
  if(!p.length) return "";
  return `<ul class="ptl ${cls||""}">${p.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}
function runpoints(s){
  const bits=(s||"").split(/\s+\u00b7\s+/).map(x=>x.trim()).filter(Boolean);
  const src=bits.length>2?bits:points(s,130,300);
  return `<ul class="ptl runp">${src.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}

async function loadBuiltin(){
  try{
    const r=await fetch("cards.json?v="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json(); if(Array.isArray(d)) BUILTIN=d;
  }catch(e){ console.error("cards.json not loaded",e); setStatus("Could not load cards.json — open the deck from its web address"); }
}
(async()=>{ await Promise.all([load(),loadBuiltin()]); await armSyncFromHash();
